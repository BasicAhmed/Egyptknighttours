name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-ci-only-secret-1234
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-only-password-1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Smoke test the built site
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://localhost:3000
